services:
  go:
    image: golang:1.22
    working_dir: /app
    volumes:
      - .:/app
      - ../frontend/dist:/frontend-dist
      - ../risk-engine:/risk-engine
      - ../simulation:/simulation
      - ../execution:/execution
      - go-mod-cache:/go/pkg/mod
    environment:
      DATABASE_URL: postgres://marketdata:marketdata@timescaledb:5432/marketdata?sslmode=disable
      TEST_DATABASE_URL: postgres://marketdata:marketdata@timescaledb:5432/marketdata?sslmode=disable
      FRONTEND_DIST_DIR: /frontend-dist
      WEB_API_ADDR: ":8080"
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    networks:
      - market-data_default
    command: ["go", "run", "./cmd/web-api"]

networks:
  market-data_default:
    external: true

volumes:
  go-mod-cache:
