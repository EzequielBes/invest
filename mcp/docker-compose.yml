services:
  go:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app:z
      - ../risk-engine:/risk-engine:z
      - ../analysis:/analysis:z
      - ../strategist:/strategist:z
      - ../simulation:/simulation:z
      - ../execution:/execution:z
      - go-mod-cache:/go/pkg/mod
    environment:
      DATABASE_URL: postgres://marketdata:marketdata@timescaledb:5432/marketdata?sslmode=disable
      TEST_DATABASE_URL: postgres://marketdata:marketdata@timescaledb:5432/marketdata?sslmode=disable
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
    networks:
      - market-data_default
    command: ["sleep", "infinity"]

networks:
  market-data_default:
    external: true

volumes:
  go-mod-cache:
